services:
  kcapp-colors:
    image: kcapp/colors:latest
    restart: unless-stopped
    environment:
      - VENUE=1
      - KCAPP_API=192.168.1.100
      - KCAPP_PORT=3000
      - DEBUG=kcapp-colors:*
      # WLED HTTP (set wled_url in venue config to use this)
      # No extra config needed, URL comes from venue config

      # WLED Serial (uncomment and add device if using serial)
      # - SERIAL=/dev/ttyUSB0

      # PWM/RGB LEDs on Raspberry Pi (uncomment if using pigpio)
      # - RED=17
      # - GREEN=22
      # - BLUE=24

    # Uncomment if using WLED over serial
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0